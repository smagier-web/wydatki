<!DOCTYPE html>
<html lang="pl">
<head>

<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEEAFB;--card:#FFFFFF;--ink:#1B1530;--muted:#6E6787;--line:#E6E1F5;--soft:#F4F1FC;--input:#F7F5FD;--acc:#7448E8;--acc-2:#9A6BFF;--acc-d:#5A30C8;--link:#6B3FE0;--on-acc:#FFFFFF;--strong:#2A1F4D;--acc-soft:#EFE9FF;--acc-line:#D6C9FF;--hero-lbl:#E9E1FF;--warn:#D9622B;--warn-bg:#FFF1E8;--warn-line:#FFD5BE;--warn-ink:#B44A17;--ok:#2F8F4E;--neg:#D6334F;--danger-bg:#FFEDF0;--danger-line:#FBC9D2;--bar:#DCD5F3;--teal:#7448E8;--shadow:rgba(60,30,140,.10);color-scheme:light}
[data-theme="dark"]{--bg:#110C1F;--card:#1B1530;--ink:#F3F0FF;--muted:#A79FC4;--line:#2C2448;--soft:#231B3C;--input:#160F28;--acc:#8E66FF;--acc-2:#A98AFF;--acc-d:#C7B4FF;--link:#BBA4FF;--on-acc:#FFFFFF;--strong:#231B3C;--acc-soft:#2A2050;--acc-line:#4A3A86;--hero-lbl:#E9E1FF;--warn:#FF9A62;--warn-bg:#2E1A12;--warn-line:#6B3418;--warn-ink:#FFB58C;--ok:#5FD08A;--neg:#FF7A90;--danger-bg:#2E1219;--danger-line:#6B1F2E;--bar:#3A3060;--teal:#8E66FF;--shadow:rgba(0,0,0,.45);color-scheme:dark}
[data-theme="pink"]{--bg:#FBEAF3;--card:#FFFFFF;--ink:#2A0F1F;--muted:#86566F;--line:#F6D8E7;--soft:#FDF1F7;--input:#FFF7FB;--acc:#D63384;--acc-2:#F06BAA;--acc-d:#A61E63;--link:#C2276F;--on-acc:#FFFFFF;--strong:#4A1430;--acc-soft:#FDE5F1;--acc-line:#F6B6D4;--hero-lbl:#FFE3F0;--warn:#D9622B;--warn-bg:#FFF1E8;--warn-line:#FFD5BE;--warn-ink:#B44A17;--ok:#2F8F4E;--neg:#C81E4A;--danger-bg:#FFEDF0;--danger-line:#FBC9D2;--bar:#F4C6DC;--teal:#D63384;--shadow:rgba(140,30,80,.12);color-scheme:light}
html,body{transition:background-color .25s}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Onest,system-ui,-apple-system,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:active{transform:scale(.98)}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1,"ss01" 1;letter-spacing:-.01em}
.gr{font-size:.58em;letter-spacing:0;vertical-align:.52em;margin-left:1px;opacity:.8}
.cur{font-size:.42em;font-weight:500;margin-left:6px;opacity:.8;letter-spacing:0}
#app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 112px)}
h1{margin:0;font-size:27px;font-weight:600;letter-spacing:-.6px}
h2{margin:0;font-size:16px;font-weight:600;letter-spacing:-.2px}
.eyebrow{font-size:12px;color:var(--muted);font-weight:500}
.muted{color:var(--muted)}
.small{font-size:12px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.card{background:var(--card);border-radius:22px;padding:16px;border:1px solid var(--line)}
.list{background:var(--card);border-radius:22px;padding:2px 14px;border:1px solid var(--line)}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--soft);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.item:last-child{border-bottom:0}
.item .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.item .t b{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.hero{background:linear-gradient(155deg,var(--acc-2) 0%,var(--acc) 55%,var(--acc-d) 130%);color:var(--on-acc);border-radius:26px;padding:20px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-70px;width:200px;height:200px;border-radius:50%;border:1px solid rgba(255,255,255,.18);pointer-events:none}
.hero .lbl{font-size:13px;color:var(--hero-lbl)}
.big{font-size:42px;font-weight:600;letter-spacing:-1.4px;line-height:1}
.track{height:7px;background:var(--soft);border-radius:4px;overflow:hidden}
.track>div{height:100%;border-radius:4px;background:var(--acc)}
.hero .track{background:rgba(255,255,255,.22)}.hero .track>div{background:#fff}
.chip-in{font-size:11px;background:rgba(255,255,255,.18);border-radius:999px;padding:5px 10px;display:inline-flex;align-items:center;gap:5px;color:#fff}
.btn{height:50px;border-radius:16px;border:1px solid var(--line);background:var(--card);font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;text-decoration:none;color:var(--ink)}
.btn.dark,.btn.pri{background:var(--acc);color:var(--on-acc);border:0}
.btn.warnb{background:var(--warn-bg);color:var(--warn-ink);border-color:var(--warn-line)}
.btn.danger{color:var(--neg);border-color:var(--danger-line);background:var(--danger-bg)}
.btn.sm{height:38px;border-radius:12px;font-size:13px;padding:0 12px}
.btn:disabled{opacity:.5}
.qa{display:flex;gap:8px}
.qa .btn{height:44px;border-radius:14px;font-size:14px;flex:1}
.pill{height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:500;color:var(--ink);white-space:nowrap}
.pill.on{background:var(--acc);color:var(--on-acc);border-color:var(--acc);font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.alert{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-ink);border-radius:14px;padding:10px 12px;font-size:13px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;font-weight:500;color:var(--muted)}
.in{height:48px;border:1px solid var(--line);border-radius:14px;padding:0 14px;background:var(--input);width:100%;font-size:16px}
.in:focus{outline:2px solid var(--acc);outline-offset:0;background:var(--card)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--soft);border-radius:14px;padding:4px;gap:4px}
.seg button{height:40px;border:0;border-radius:11px;background:transparent;color:var(--muted);font-weight:500}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 2px var(--shadow)}
.catgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.catbtn{min-height:72px;border-radius:16px;border:1.5px solid transparent;font-size:11px;font-weight:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:6px 2px;line-height:1.15;text-align:center}
.catbtn.on{border-color:currentColor;box-shadow:0 0 0 3px var(--card) inset}
.amount-in{border:0;outline:0;background:transparent;text-align:center;font:600 48px Onest,sans-serif;width:100%;letter-spacing:-1.5px;font-variant-numeric:tabular-nums}
.check{width:26px;height:26px;accent-color:var(--acc);margin:0;flex:0 0 auto}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(env(safe-area-inset-bottom) + 6px);z-index:20}
.tabs .in-tabs{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:start}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:500;color:var(--muted);padding:6px 0;min-height:48px}
.tab.on{color:var(--link);font-weight:600}
.fab{justify-self:center;margin-top:-22px;width:58px;height:58px;border-radius:29px;background:linear-gradient(155deg,var(--acc-2),var(--acc));color:var(--on-acc);border:4px solid var(--bg);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px var(--shadow)}
.sheet{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;justify-content:flex-end}
.sheet.hidden{display:none}
.sheet-bg{position:absolute;inset:0;background:rgba(27,21,48,.45)}
.sheet-card{position:relative;background:var(--card);border-radius:26px 26px 0 0;max-height:94vh;overflow-y:auto;padding:14px 18px calc(env(safe-area-inset-bottom) + 18px);width:100%;max-width:560px;margin:0 auto}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.x{width:42px;height:42px;border-radius:21px;border:0;background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--ink);flex:0 0 auto}
.x.acc{background:var(--acc);color:var(--on-acc)}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 100px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
#toast.show{opacity:1}
#busy{position:fixed;top:0;left:0;height:3px;background:var(--acc);z-index:70;width:0;transition:width .4s}
#busy.on{width:80%}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--soft);border-top-color:var(--acc);animation:sp 1s linear infinite;margin:20px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.hscroll{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.hscroll::-webkit-scrollbar{display:none}
.catcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;min-width:0}
.catcard .cn{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.bars{display:flex;align-items:flex-end;gap:10px;height:120px}
.bars>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars span{font-size:11px;color:var(--muted)}
.bars i{display:block;width:100%;border-radius:10px;background:var(--bar);min-height:3px}
.recrow{display:grid;grid-template-columns:1fr 92px 30px;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid var(--soft)}
.recrow .in{height:40px;font-size:15px;border-radius:10px;padding:0 10px}
.recrow select.in{grid-column:1 / span 2;height:34px;font-size:13px;border:0}
.link{color:var(--link);font-weight:600;text-decoration:none;background:none;border:0;padding:0;font-size:13.5px}
.demo{background:var(--acc-soft);color:var(--link);border-radius:12px;padding:8px 12px;font-size:12px;margin-bottom:12px}
.goal-bar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.goal-bar>div{height:100%;border-radius:4px}
.goal{background:linear-gradient(155deg,var(--acc-2),var(--acc));color:#fff;border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px}
.goal .goal-bar{background:rgba(255,255,255,.25)}.goal .goal-bar>div{background:#fff}
.goal .btn.sm{background:rgba(255,255,255,.18);color:#fff;border:0}
.goal .btn.sm.w{background:#fff;color:var(--acc-d)}
.standalone .tabs{padding-bottom:max(env(safe-area-inset-bottom),20px)}
.standalone #app{padding-bottom:calc(max(env(safe-area-inset-bottom),20px) + 104px)}
details.cat{border-bottom:1px solid var(--soft)}
details.cat:last-child{border-bottom:0}
details.cat summary{list-style:none;display:flex;align-items:center;gap:10px;padding:11px 0;cursor:pointer}
details.cat summary::-webkit-details-marker{display:none}
details.cat summary .chev{transition:transform .2s;color:var(--muted)}
details.cat[open] summary .chev{transform:rotate(90deg)}
.hbar{height:6px;border-radius:3px;background:var(--soft);overflow:hidden;margin-top:5px}
.hbar>div{height:100%;border-radius:3px}
.prod{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0 8px 48px;border-top:1px dashed var(--line);font-size:13px}
.prod .pn{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prod .pm{color:var(--muted);font-size:12px}
.av{width:36px;height:36px;border-radius:18px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;border:3px solid var(--bg)}
.ring{flex:0 0 auto}
</style>
</head>
<body>
<div id="busy"></div>
<main id="app"><div class="spin" aria-label="Wczytywanie"></div></main>
<nav class="tabs" aria-label="Nawigacja"><div class="in-tabs" id="tabs"></div></nav>
<div id="sheet" class="sheet hidden" role="dialog" aria-modal="true"><div class="sheet-bg" onclick="closeSheet()"></div><div class="sheet-card" id="sheetCard"></div></div>
<div id="toast" role="status"></div>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<input type="file" id="gal" accept="image/*" hidden>

<script>
/* ================= Połączenie z backendem ================= */
// Trzy tryby: 1) Google Apps Script (google.script.run), 2) GitHub Pages → API skryptu (fetch + token), 3) demo.
const IS_GAS = typeof google !== 'undefined' && google.script && google.script.run;
const CFG_KEY = 'dw_cfg_v1';
let CFG = null;
try { CFG = JSON.parse(localStorage.getItem(CFG_KEY) || 'null'); } catch (e) { CFG = null; }
(function readHash() {
  // Link konfiguracyjny: index.html#api=<adres /exec>&token=<token>
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('api') && h.get('token')) {
    CFG = Object.assign({}, CFG || {}, { api: h.get('api').trim(), token: h.get('token').trim(), user: (CFG && CFG.user) || '' });
    try { localStorage.setItem(CFG_KEY, JSON.stringify(CFG)); } catch (e) { }
    // W Safari zostawiamy #api=… w adresie, żeby „Do ekranu początkowego” zapisało pełny link
    // (aplikacja z ikony ma osobną pamięć). W trybie pełnoekranowym czyścimy adres.
    let standalone = false;
    try { standalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches; } catch (e) { }
    if (standalone) history.replaceState(null, '', location.pathname + location.search);
  }
})();
const IS_API = !IS_GAS && !!(CFG && CFG.api && CFG.token);
const IS_DEMO = !IS_GAS && !IS_API;

async function remote(fn, args, cfg) {
  cfg = cfg || CFG;
  const res = await fetch(cfg.api, { method: 'POST', body: JSON.stringify({ token: cfg.token, user: cfg.user, fn: fn, args: args }) });
  if (!res.ok) throw new Error('Błąd połączenia (' + res.status + ')');
  let j; try { j = await res.json(); } catch (e) { throw new Error('Serwer nie zwrócił danych. Sprawdź adres /exec i czy wdrożenie ma dostęp „Każdy”.'); }
  if (!j.ok) throw new Error(j.error || 'Nieznany błąd');
  return j.data;
}
function api(fn) {
  const args = Array.prototype.slice.call(arguments, 1);
  if (IS_GAS) return new Promise((res, rej) => { const r = google.script.run.withSuccessHandler(res).withFailureHandler(rej); r[fn].apply(r, args); });
  if (IS_API) return remote(fn, args);
  return new Promise((res, rej) => setTimeout(() => { try { res(Mock[fn].apply(null, args)); } catch (e) { rej(e); } }, fn === 'scanReceipt' ? 1200 : 150));
}

/* Ekran pierwszej konfiguracji (GitHub Pages) */
function setupScreen(msg) {
  document.getElementById('tabs').innerHTML = '';
  const c = CFG || {};
  document.getElementById('app').innerHTML = `<div class="stack" style="padding-top:20px">
    <div class="row" style="gap:12px"><img src="icon-192.png" alt="" width="56" height="56" style="border-radius:14px"><div><h1>Domowe Wydatki</h1><div class="muted">Połącz aplikację z Waszym arkuszem</div></div></div>
    ${msg ? `<div class="alert">${esc(msg)}</div>` : ''}
    <div class="card stack">
      <div class="field"><label for="cApi">Adres skryptu (kończy się na /exec)</label><input id="cApi" class="in" value="${esc(c.api || '')}" placeholder="https://script.google.com/macros/s/…/exec" autocapitalize="off" autocorrect="off"></div>
      <div class="field"><label for="cTok">Token aplikacji</label><input id="cTok" class="in" value="${esc(c.token || '')}" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
      <button class="btn pri" onclick="setupConnect()">Połącz</button>
      <div id="cWho"></div>
    </div>
    <div class="card" style="background:var(--acc-soft);color:var(--link)"><b>Na iPhonie:</b> najpierw wybierz <b>Udostępnij → Do ekranu początkowego</b>, a dopiero potem otwórz aplikację ikoną i kliknij „Połącz”.</div>
    <p class="small muted">Adres i token znajdziesz w dzienniku skryptu po uruchomieniu funkcji <b>pokazToken</b>. Zapisują się tylko na tym telefonie. Nie udostępniaj ich nikomu spoza domu.</p>
    <button class="btn" onclick="startDemo()">Zobacz wersję demo</button>
  </div>`;
}
async function setupConnect() {
  const cfg = { api: val('cApi').trim(), token: val('cTok').trim(), user: '' };
  if (!/^https:\/\/script\.google\.com\/.+\/exec/.test(cfg.api)) return toast('Wklej adres kończący się na /exec');
  if (!cfg.token) return toast('Wklej token');
  busy(true);
  try {
    const members = await probeMembers(cfg);
    document.getElementById('cWho').innerHTML = `<div class="field" style="margin-top:6px"><label>Kim jesteś?</label><div class="grid2">${members.map(n => `<button class="btn" onclick="setupFinish('${esc(n)}')">${esc(n)}</button>`).join('')}</div></div>`;
  } catch (e) { toast(errMsg(e)); }
  finally { busy(false); }
}
async function probeMembers(cfg) {
  try { await remote('hello', [], Object.assign({}, cfg, { user: '__check__' })); }
  catch (e) {
    if (/Nieprawidłowy token/.test(e.message)) throw new Error('Nieprawidłowy token aplikacji.');
    const m = String(e.message).match(/DOMOWNICY:(.+)$/);
    if (m) return m[1].split('|');
    if (!/Nieznany domownik/.test(e.message)) throw e;
  }
  return ['Ty', 'Żona'];
}
function setupFinish(user) {
  CFG = { api: val('cApi').trim(), token: val('cTok').trim(), user: user };
  try { localStorage.setItem(CFG_KEY, JSON.stringify(CFG)); } catch (e) { }
  location.reload();
}
function startDemo() { window.__demo = true; api = function (fn) { const a = Array.prototype.slice.call(arguments, 1); return Promise.resolve(Mock[fn].apply(null, a)); }; boot(); }
function logout() {
  if (!confirm('Odłączyć ten telefon od arkusza? Dane w arkuszu zostaną.')) return;
  try { localStorage.removeItem(CFG_KEY); } catch (e) { }
  location.reload();
}

/* ================= Stan ================= */
let D = null;
let view = 'home';
let billMonth = curMonth();
let hist = { filter: 'all', q: '' };
let scanState = null;
let stat = { period: 'm', month: curMonth(), billsIn: false };

const MONTHS = ['styczeń','luty','marzec','kwiecień','maj','czerwiec','lipiec','sierpień','wrzesień','październik','listopad','grudzień'];
const MONTHS_GEN = ['stycznia','lutego','marca','kwietnia','maja','czerwca','lipca','sierpnia','września','października','listopada','grudnia'];
const MONTHS_SHORT = ['sty','lut','mar','kwi','maj','cze','lip','sie','wrz','paź','lis','gru'];
const DAYS = ['Niedziela','Poniedziałek','Wtorek','Środa','Czwartek','Piątek','Sobota'];
const PALETTE = [['#E3F5E8','#2F8F4E'],['#E7EDFF','#3B5BDB'],['#FFEBDD','#D2611F'],['#FDE4EE','#C2306B'],['#EEE7FF','#6D3FE0'],['#E0F4F4','#16807F'],['#FFF3D6','#A86A00'],['#FFE6E6','#C2343B'],['#F3E6FF','#8A3FC7'],['#EAF4DA','#58801C'],['#E6F1FB','#2470B3'],['#EFEDF5','#5C5670'],['#EFEDF5','#5C5670']];
const GOAL_COLORS = ['#7448E8','#D63384','#16807F','#D2611F','#3B5BDB','#2F8F4E'];
const BILL_SOURCE = 'Opłata stała';

/* ================= Motywy ================= */
const THEMES = [
  { id: 'light', name: 'Fiolet', bg: '#EEEAFB', card: '#FFFFFF', acc: '#7448E8' },
  { id: 'dark', name: 'Noc', bg: '#110C1F', card: '#1B1530', acc: '#8E66FF' },
  { id: 'pink', name: 'Róż', bg: '#FBEAF3', card: '#FFFFFF', acc: '#D63384' }
];
let theme = 'light';
try { theme = localStorage.getItem('dw_theme') || 'light'; } catch (e) { }
function applyTheme(t) {
  const th = THEMES.find(x => x.id === t) || THEMES[0];
  theme = th.id;
  document.documentElement.setAttribute('data-theme', th.id);
  const m = document.getElementById('themeColor'); if (m) m.setAttribute('content', th.bg);
  try { localStorage.setItem('dw_theme', th.id); } catch (e) { }
}
applyTheme(theme);
try { if (window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches) document.documentElement.classList.add('standalone'); } catch (e) { }
function setTheme(t) {
  applyTheme(t);
  document.querySelectorAll('.theme-opt').forEach(b => b.setAttribute('aria-pressed', b.dataset.t === t ? 'true' : 'false'));
  document.querySelectorAll('.theme-opt').forEach(b => b.style.outline = b.dataset.t === t ? '3px solid var(--acc)' : 'none');
  api('setTheme', t).catch(() => { });
}
function themePicker() {
  return `<div class="grid3">${THEMES.map(t => `<button type="button" class="theme-opt" data-t="${t.id}" aria-pressed="${t.id === theme}" onclick="setTheme('${t.id}')" style="border:1px solid var(--line);border-radius:16px;padding:10px;background:var(--card);color:var(--ink);display:flex;flex-direction:column;gap:8px;align-items:stretch;outline:${t.id === theme ? '3px solid var(--acc)' : 'none'};outline-offset:1px">
    <span style="height:54px;border-radius:10px;background:${t.bg};display:flex;flex-direction:column;gap:5px;padding:7px;box-sizing:border-box;border:1px solid rgba(0,0,0,.06)">
      <span style="height:14px;border-radius:5px;background:${t.acc}"></span><span style="height:8px;width:70%;border-radius:4px;background:${t.card}"></span><span style="height:8px;width:50%;border-radius:4px;background:${t.card}"></span></span>
    <b style="font-size:13px;text-align:center">${t.name}</b></button>`).join('')}</div>`;
}
function themeSheet() { openSheet(sheetHead('Motyw aplikacji') + `<div class="stack">${themePicker()}<p class="small muted" style="margin:0">Motyw zapamiętuje się osobno dla każdego z Was, na Waszych kontach Google.</p></div>`); }

/* ================= Pomocnicze ================= */
const nf = new Intl.NumberFormat('pl-PL', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
function zl(n) { return nf.format(Number(n) || 0).replace(/ /g, ' ') + ' zł'; }
function zl0(n) { return new Intl.NumberFormat('pl-PL', { maximumFractionDigits: 0 }).format(Math.round(Number(n) || 0)).replace(/ /g, ' ') + ' zł'; }
function num(v) { const n = parseFloat(String(v == null ? '' : v).replace(/\s/g, '').replace(',', '.')); return isNaN(n) ? 0 : n; }
function r2(n) { return Math.round(n * 100) / 100; }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]); }
function pad(n) { return String(n).padStart(2, '0'); }
function today() { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function curMonth() { return today().slice(0, 7); }
function shiftMonth(m, k) { const [y, mo] = m.split('-').map(Number); const d = new Date(y, mo - 1 + k, 1); return d.getFullYear() + '-' + pad(d.getMonth() + 1); }
function monthName(m) { const [y, mo] = m.split('-').map(Number); return MONTHS[mo - 1].replace(/^./, c => c.toUpperCase()) + ' ' + y; }
function dayLabel(ds) {
  const t = today(), y = new Date(); y.setDate(y.getDate() - 1);
  const ys = y.getFullYear() + '-' + pad(y.getMonth() + 1) + '-' + pad(y.getDate());
  const [yy, mm, dd] = ds.split('-').map(Number); const d = new Date(yy, mm - 1, dd);
  const base = dd + ' ' + MONTHS_GEN[mm - 1];
  if (ds === t) return 'Dziś, ' + base;
  if (ds === ys) return 'Wczoraj, ' + base;
  return DAYS[d.getDay()] + ', ' + base;
}
function sum(list, k) { return list.reduce((a, x) => a + (Number(x[k || 'amount']) || 0), 0); }
function catIdx(name) { const i = D.categories.findIndex(c => c.name === name); return i < 0 ? PALETTE.length - 1 : i % PALETTE.length; }
function catColors(name) { return PALETTE[catIdx(name)]; }
function catShort(name) { const w = String(name).split(/\s+/); return (w[0][0] + (w[0][1] || '')).replace(/^./, c => c.toUpperCase()); }
const CAT_ICONS = [
  [/spo[zż]yw|jedzen|zakup|market/i, '<path d="M5.5 8h13l-1.2 11.2a1 1 0 0 1-1 .8H7.7a1 1 0 0 1-1-.8z"/><path d="M9 10V7a3 3 0 0 1 6 0v3"/>'],
  [/restaur|knajp|obiad|kawiar|fast/i, '<path d="M7 3v7a2 2 0 0 0 2 2v9M11 3v7a2 2 0 0 1-2 2M7 3v4M11 3v4"/><path d="M17 21V3c-2 1.2-3 4-3 7.5h3"/>'],
  [/transport|auto|paliw|samoch/i, '<path d="M4.5 16.5V12l1.8-4.8A2 2 0 0 1 8.2 6h7.6a2 2 0 0 1 1.9 1.2L19.5 12v4.5a1 1 0 0 1-1 1h-13a1 1 0 0 1-1-1z"/><path d="M4.5 12h15M7 17.5V19M17 17.5V19"/><circle cx="8" cy="14.5" r=".6"/><circle cx="16" cy="14.5" r=".6"/>'],
  [/dziec|dziecko|przedszk/i, '<circle cx="12" cy="13" r="6.5"/><circle cx="6.5" cy="6.5" r="2"/><circle cx="17.5" cy="6.5" r="2"/><path d="M10 15c1.1.9 2.9.9 4 0M9.8 11.5h.01M14.2 11.5h.01"/>'],
  [/zdrow|aptek|lek/i, '<path d="M12 20s-7-4.3-7-9.6A4 4 0 0 1 12 8a4 4 0 0 1 7 2.4C19 15.7 12 20 12 20z"/>'],
  [/chemi|higien|kosmet/i, '<path d="M12 3.5s5.5 6 5.5 10.2a5.5 5.5 0 0 1-11 0C6.5 9.5 12 3.5 12 3.5z"/><path d="M9.5 14.5a2.5 2.5 0 0 0 2.5 2.5"/>'],
  [/prezent|urodzin/i, '<rect x="4" y="9" width="16" height="11" rx="1.5"/><path d="M3.5 9h17M12 9v11"/><path d="M12 9C10.5 5.5 7 5 7 7.2 7 8.6 9.5 9 12 9zM12 9c1.5-3.5 5-4 5-1.8C17 8.6 14.5 9 12 9z"/>'],
  [/zwierz|pies|kot|karma/i, '<circle cx="6.5" cy="11" r="1.7"/><circle cx="17.5" cy="11" r="1.7"/><circle cx="9.5" cy="6.5" r="1.7"/><circle cx="14.5" cy="6.5" r="1.7"/><path d="M8 17.5c0-2.6 1.9-5 4-5s4 2.4 4 5c0 2-2 2.5-4 1.8-2 .7-4 .2-4-1.8z"/>'],
  [/rachun|op[lł]at|czynsz|media/i, '<path d="M6.5 3.5h11v17l-2.75-1.6L12 20.5l-2.75-1.6L6.5 20.5z"/><path d="M9.5 8h5M9.5 11.5h5M9.5 15h3"/>'],
  [/ubran|odzie|but/i, '<path d="M9 4 4 6.5l1.5 4 2-1V20h9V9.5l2 1 1.5-4L15 4a3 3 0 0 1-6 0z"/>'],
  [/rozryw|kino|hobby|sport/i, '<path d="M4 8.5a2 2 0 0 0 0 4v3.5h16v-3.5a2 2 0 0 1 0-4V5H4z"/><path d="M14 5v11" stroke-dasharray="1.5 2"/>'],
  [/edukac|szko[lł]|ksi[aą][zż]/i, '<path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5zM20 5.5A1.5 1.5 0 0 0 18.5 4H13v16h5.5a1.5 1.5 0 0 0 1.5-1.5z"/>'],
  [/dom|mieszk|remont/i, '<path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z"/>']
];
function catSvg(name, size) {
  const hit = CAT_ICONS.find(x => x[0].test(String(name)));
  const body = hit ? hit[1] : '<circle cx="6.5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="17.5" cy="12" r="1.2"/>';
  return `<svg width="${size || 20}" height="${size || 20}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${body}</svg>`;
}
function catIcon(name, size) { const c = catColors(name), sz = size || 38; return `<span class="ic" style="background:${c[0]};color:${c[1]};width:${sz}px;height:${sz}px;border-radius:${Math.round(sz * .32)}px" aria-hidden="true">${catSvg(name, Math.round(sz * .52))}</span>`; }
/* Duże kwoty: grosze mniejsze i podniesione, „zł” lżejsze */
function money(n, opt) {
  const v = Number(n) || 0, s = nf.format(Math.abs(v)).replace(/ /g, ' ');
  const [i, d] = s.split(',');
  return `<span class="num">${v < 0 ? '−' : (opt && opt.sign ? '+' : '')}${i}<span class="gr">,${d}</span><span class="cur">zł</span></span>`;
}
function whoOptions() { return D.members.concat(['Wspólne']); }
function initials(n) { return n === 'Wspólne' ? 'W' : String(n).charAt(0).toUpperCase(); }
const MEMBER_COLORS = ['#7448E8', '#E2559B', '#16807F', '#D2611F'];

/* Obliczenia */
function monthExp(m) { return D.expenses.filter(e => e.date.slice(0, 7) === m); }
function isBill(e) { return e.source === BILL_SOURCE; }
function realIncomes() { return D.incomes.filter(i => i.type !== 'Korekta'); }
function savedTotal() { return sum(D.deposits || []); }
function balance() { return r2(D.settings.startBalance + sum(D.incomes) - sum(D.expenses) - savedTotal()); }
function billPaid(b, m) { return D.expenses.find(e => e.billKey === b.id + '|' + m); }
function activeBills() { return D.bills.filter(b => b.active).sort((a, b) => a.day - b.day); }

/* UI */
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2600); }
function busy(on) { document.getElementById('busy').classList.toggle('on', !!on); }
function errMsg(e) { return (e && (e.message || e)) + ''; }
async function act(fn) {
  const args = Array.prototype.slice.call(arguments, 1);
  busy(true);
  try { D = await api.apply(null, [fn].concat(args)); render(); return true; }
  catch (e) { toast(errMsg(e)); return false; }
  finally { busy(false); }
}
function openSheet(html) { document.getElementById('sheetCard').innerHTML = '<div class="grab"></div>' + html; document.getElementById('sheet').classList.remove('hidden'); document.body.style.overflow = 'hidden'; }
function closeSheet() { document.getElementById('sheet').classList.add('hidden'); document.body.style.overflow = ''; }
function go(v) { view = v; render(); window.scrollTo(0, 0); }
function val(id) { const el = document.getElementById(id); return el ? el.value : ''; }

const ICONS = {
  home: '<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',

function svg(name, size, sw) { return `<svg width="${size || 22}" height="${size || 22}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw || 2}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]}</svg>`; }

/* ================= Render ================= */
function render() {
  if (!D) return;
  const v = { home: vHome, hist: vHist, bills: vBills, budget: vBudget, goals: vGoals, cats: vCats, stats: vStats }[view] || vHome;
  document.getElementById('app').innerHTML = ((IS_GAS || IS_API) ? '' : '<div class="demo">Tryb demo: dane są przykładowe i zostają tylko na tym urządzeniu. Po wdrożeniu w Google Apps Script wszystko zapisuje się we wspólnym arkuszu.</div>') + v();
  renderTabs();
  if (view === 'hist') { const s = document.getElementById('q'); if (s && hist.focus) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); } }
}
function renderTabs() {
  const t = (id, label, icon, alt) => `<button class="tab ${view === id || view === alt ? 'on' : ''}" onclick="go('${id}')">${svg(icon, 23, 1.8)}${label}</button>`;
  document.getElementById('tabs').innerHTML =
    t('home', 'Pulpit', 'home', 'cats') + t('hist', 'Historia', 'list') +
    `<button class="fab" aria-label="Skanuj paragon" onclick="startScan()">${svg('scan', 25, 2)}</button>` +
    t('budget', 'Budżet', 'wallet', 'goals') + t('stats', 'Statystyki', 'chart', 'bills');
}
function backBtn(to) { return `<button class="x" style="background:var(--card);border:1px solid var(--line)" aria-label="Wróć" onclick="go('${to}')">${svg('back', 20, 2)}</button>`; }
function pageHead(title, back, right) { return `<div class="between" style="min-height:44px"><div class="row" style="gap:12px">${back ? backBtn(back) : ''}<h1>${title}</h1></div>${right || ''}</div>`; }
function daysLeft() { const n = new Date(); return new Date(n.getFullYear(), n.getMonth() + 1, 0).getDate() - n.getDate() + 1; }

function vHome() {
  const m = curMonth(), ex = monthExp(m), varEx = ex.filter(e => !isBill(e));
  const spent = sum(varEx), bud = D.settings.budget, pct = bud ? Math.min(100, Math.round(spent / bud * 100)) : 0;
  const unpaid = activeBills().filter(b => !billPaid(b, m));
  const byCat = {}; varEx.forEach(e => byCat[e.category] = (byCat[e.category] || 0) + e.amount);
  const cats = Object.keys(byCat).sort((a, b) => byCat[b] - byCat[a]).slice(0, 6);
  const recent = D.expenses.slice().sort((a, b) => b.date.localeCompare(a.date) || b.added - a.added).slice(0, 5);
  const goals = (D.goals || []).filter(g => g.active);
  const avatars = D.members.map((n, i) => `<span class="av" style="background:${MEMBER_COLORS[i % 4]};${i ? 'margin-left:-10px' : ''}" title="${esc(n)}">${esc(initials(n))}</span>`).join('');
  const live = IS_GAS || IS_API;
  return `<div class="stack" style="gap:16px">
    <div class="between"><div><div class="eyebrow">${monthName(m)}</div><h1>Nasz dom</h1></div>
      <div class="row" style="gap:10px"><button class="x" style="background:var(--card);border:1px solid var(--line)" aria-label="Ustawienia" onclick="settingsSheet()">${svg('gear', 19, 1.8)}</button><div class="row" style="gap:0">${avatars}</div></div></div>
    <section class="hero" aria-label="Podsumowanie miesiąca">
      <div class="between" style="align-items:flex-start"><span class="lbl">Wydaliśmy w tym<br>miesiącu</span>${live ? `<span class="chip-in">${svg('check', 12, 2.4)}Arkusz</span>` : ''}</div>
      <span class="big">${money(spent)}</span>
      ${bud ? `<div class="track"><div style="width:${pct}%"></div></div>
      <div class="between lbl" style="font-size:12px"><span>${pct}% z budżetu ${zl0(bud)}</span><span>${spent > bud ? 'ponad o ' + zl(spent - bud) : 'zostało ' + zl(bud - spent)}</span></div>` : `<button class="link" style="color:#fff;text-align:left" onclick="settingsSheet()">Ustaw miesięczny budżet ›</button>`}
      <button onclick="go('budget')" style="display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.16);border:0;border-radius:14px;padding:11px 13px;color:#fff;font-size:14px"><span>Saldo konta</span><b class="num" style="font-size:15px;font-weight:600">${zl(balance())} ›</b></button>
    </section>
    <div class="qa">
      <button class="btn pri" onclick="startScan()">${svg('scan', 17)}Skanuj</button>
      <button class="btn" onclick="expenseSheet()">${svg('plus', 17)}Ręcznie</button>
      <button class="btn ${unpaid.length ? 'warnb' : ''}" onclick="go('bills')">Opłaty${unpaid.length ? ' · ' + unpaid.length : ' ' + svg('check', 15, 2.4)}</button>
    </div>
    ${cats.length ? `<div class="stack" style="gap:10px"><div class="between"><h2>Kategorie</h2><button class="link" onclick="go('cats')">Wszystkie</button></div>
      <div class="grid3">${cats.map(c => `<button class="catcard" onclick="go('stats')">${catIcon(c, 34)}<span class="cn">${esc(c)}</span><b class="num" style="font-size:15px;font-weight:600">${zl0(byCat[c])}</b></button>`).join('')}</div></div>` : ''}
    ${goals.length ? `<div class="stack" style="gap:10px"><div class="between"><h2>Skarbonki</h2><button class="link" onclick="go('goals')">Wszystkie</button></div>
      <div class="hscroll">${goals.map(g => { const p = g.target ? Math.min(100, Math.round(g.saved / g.target * 100)) : 0; return `<button class="catcard" style="flex:0 0 auto;width:168px" onclick="go('goals')"><b style="font-size:13.5px">${esc(g.name)}</b><span class="num" style="font-size:16px;font-weight:600">${zl0(g.saved)}</span><div class="goal-bar" style="width:100%"><div style="width:${p}%;background:${g.color || 'var(--acc)'}"></div></div><span class="small muted">${p}% z ${zl0(g.target)}</span></button>`; }).join('')}</div></div>`
      : `<button class="btn" onclick="go('goals')">${svg('piggy', 18)}Załóż skarbonkę na cel</button>`}
    <div class="stack" style="gap:10px"><div class="between"><h2>Ostatnie</h2><button class="link" onclick="go('hist')">Historia</button></div>
      ${recent.length ? `<div class="list">${recent.map(expRow).join('')}</div>` : `<div class="card muted">Zeskanuj pierwszy paragon albo dodaj wydatek ręcznie. Pojawi się tutaj.</div>`}
    </div>
  </div>`;
}

function expRow(e) {
  const src = e.source === 'Paragon' ? 'paragon' : e.source === BILL_SOURCE ? 'opłata stała' : 'ręcznie';
  const meta = [e.store || e.category, e.who, src, e.date !== today() ? e.date.slice(8) + '.' + e.date.slice(5, 7) : ''].filter(Boolean).join(' · ');
  return `<button class="item" onclick="expenseSheet('${e.id}')">${catIcon(e.category)}<span class="t"><b>${esc(e.desc || e.category)}</b><span class="small muted">${esc(meta)}</span></span><span class="num" style="font-weight:600;font-size:14.5px">−${zl(e.amount)}</span></button>`;
}

function vHist() {
  const opts = [['all', 'Wszystko']].concat(D.members.map(m => [m, m]), [['Wspólne', 'Wspólne'], ['Paragon', 'Paragony'], [BILL_SOURCE, 'Opłaty']]);
  return `<div class="stack">
    ${pageHead('Historia', 'home')}
    <div class="field" style="position:relative"><label for="q" style="position:absolute;left:-9999px">Szukaj</label>
      <span style="position:absolute;left:14px;top:14px;color:var(--muted)">${svg('search', 19, 1.8)}</span>
      <input id="q" class="in" style="background:var(--card);padding-left:42px" placeholder="Szukaj produktu, sklepu, kwoty…" value="${esc(hist.q)}" oninput="hist.q=this.value;document.getElementById('hlist').innerHTML=histList()" onfocus="hist.focus=true" onblur="hist.focus=false"></div>
    <div class="chips">${opts.map(o => `<button class="pill ${hist.filter === o[0] ? 'on' : ''}" onclick="hist.filter='${esc(o[0])}';render()">${esc(o[1])}</button>`).join('')}</div>
    <div id="hlist" class="stack">${histList()}</div>
  </div>`;
}
function histList() {
  const q = hist.q.trim().toLowerCase();
  let list = D.expenses.filter(e => {
    if (hist.filter !== 'all') {
      if (hist.filter === 'Paragon' || hist.filter === BILL_SOURCE) { if (e.source !== hist.filter) return false; }
      else if (e.who !== hist.filter) return false;
    }
    if (!q) return true;
    return [e.desc, e.store, e.category, e.who, String(e.amount).replace('.', ',')].join(' ').toLowerCase().indexOf(q) >= 0;
  }).sort((a, b) => b.date.localeCompare(a.date) || b.added - a.added);
  if (!list.length) return '<div class="card muted">Nic nie znaleziono.</div>';
  const groups = [];
  list.slice(0, 300).forEach(e => { const g = groups[groups.length - 1]; if (g && g.d === e.date) g.items.push(e); else groups.push({ d: e.date, items: [e] }); });
  return groups.map(g => `<div class="stack" style="gap:6px"><div class="between" style="padding:0 4px;font-size:13px;font-weight:500"><span>${dayLabel(g.d)}</span><span class="num muted">−${zl(sum(g.items))}</span></div><div class="list">${g.items.map(expRow).join('')}</div></div>`).join('');
}

function ring(pct, label, color) {

    <circle cx="52" cy="52" r="42" fill="none" stroke="${color}" stroke-width="11" stroke-linecap="round" stroke-dasharray="${(C * p / 100).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 52 52)"/>
    <text x="52" y="59" text-anchor="middle" font-size="21" font-weight="600" style="font-family:inherit;fill:var(--ink)">${label}</text></svg>`;
}

function vStats() {
  const m = curMonth(), ex = monthExp(m);
  const months = []; for (let k = 5; k >= 0; k--) months.push(shiftMonth(m, -k));
  const mTotals = months.map(mm => sum(monthExp(mm)));
  const maxT = Math.max.apply(null, mTotals.concat([1]));
  const avg = mTotals.filter(Boolean).length ? sum(mTotals.filter(Boolean).map(a => ({ amount: a }))) / mTotals.filter(Boolean).length : 0;
  const byWho = {}; ex.forEach(e => { if (e.who && e.who !== 'Wspólne') byWho[e.who] = (byWho[e.who] || 0) + e.amount; });
  const members = D.members, totalWho = sum(Object.keys(byWho).map(k => ({ amount: byWho[k] })));
  let settle = '';
  if (members.length === 2 && totalWho > 0) {
    const a = byWho[members[0]] || 0, b = byWho[members[1]] || 0, half = (a + b) / 2;
    settle = Math.abs(a - half) < 0.01 ? 'Jesteście rozliczeni 50/50.' : `${esc(a > half ? members[1] : members[0])} → ${esc(a > half ? members[0] : members[1])}: <b class="num">${zl(Math.abs(a - half))}</b> do wyrównania 50/50`;
  }
  const prodCount = {}; ex.filter(e => e.source === 'Paragon').forEach(e => { const k = prodKey(e.desc); if (!k) return; const p = prodCount[k] || (prodCount[k] = { name: e.desc, n: 0 }); p.n++; });
  const topProds = Object.values(prodCount).sort((a, b) => b.n - a.n).slice(0, 4);
  return `<div class="stack">
    ${pageHead('Statystyki')}
    ${statsSection()}
    <div class="card stack" style="gap:14px"><div class="between"><h2>Ostatnie 6 miesięcy</h2><span class="small muted">średnio <b class="num" style="color:var(--ink)">${zl0(avg)}</b></span></div>
      <div class="bars">${months.map((mm, i) => `<div><span class="num" style="font-size:10px">${mTotals[i] ? zl0(mTotals[i]).replace(' zł', '') : ''}</span><i style="height:${Math.round(mTotals[i] / maxT * 86)}px;${i === 5 ? 'background:var(--acc)' : ''}"></i><span>${MONTHS_SHORT[Number(mm.slice(5)) - 1]}</span></div>`).join('')}</div></div>
    ${totalWho || topProds.length ? `<div class="grid2">
      ${totalWho ? `<div class="card stack" style="gap:10px;padding:14px"><span class="small" style="font-weight:600">Kto ile wydał</span>
        <div style="display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px">${members.map((n, i) => `<div style="flex:${byWho[n] || 0};background:${MEMBER_COLORS[i % 4]}"></div>`).join('')}</div>
        <div class="small">${members.map(n => `<div class="between"><span>${esc(n)}</span><b class="num">${Math.round((byWho[n] || 0) / totalWho * 100)}%</b></div>`).join('')}</div></div>` : ''}
      ${topProds.length ? `<div class="card stack" style="gap:8px;padding:14px"><span class="small" style="font-weight:600">Najczęściej kupowane</span>
        <div class="small">${topProds.map(p => `<div class="between" style="gap:6px"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.name)}</span><b class="num">${p.n}×</b></div>`).join('')}</div></div>` : ''}
    </div>` : ''}
    ${settle ? `<div class="card between" style="gap:12px"><span style="font-size:14px">${settle}</span></div>` : ''}
  </div>`;
}

/* ================= Na co najwięcej wydajemy ================= */
function statRange() {
  const m = stat.month, months = stat.period === 'm' ? 1 : stat.period === 'q' ? 3 : 12;
  const list = []; for (let k = months - 1; k >= 0; k--) list.push(shiftMonth(m, -k));
  const label = months === 1 ? monthName(m) : MONTHS_SHORT[Number(list[0].slice(5)) - 1] + ' ' + list[0].slice(0, 4) + ' – ' + MONTHS_SHORT[Number(m.slice(5)) - 1] + ' ' + m.slice(0, 4);
  return { months: list, label };
}
function prodKey(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ł/g, 'l').replace(/[^a-z0-9%,.]+/g, ' ').trim(); }
function statsSection() {
  const R = statRange(), set = {}; R.months.forEach(m => set[m] = 1);
  const ex = D.expenses.filter(e => set[e.date.slice(0, 7)] && (stat.billsIn || !isBill(e)));
  const total = sum(ex);
  const cats = {};
  ex.forEach(e => {
    const c = cats[e.category] || (cats[e.category] = { name: e.category, total: 0, n: 0, prods: {} });
    c.total += e.amount; c.n++;
    const k = prodKey(e.desc || e.category);
    const p = c.prods[k] || (c.prods[k] = { name: e.desc || e.category, total: 0, n: 0, last: '', who: {}, store: {} });
    p.total += e.amount; p.n++;
    if (e.date >= p.last) { p.last = e.date; p.name = e.desc || e.category; }
    if (e.who) p.who[e.who] = 1; if (e.store) p.store[e.store] = 1;
  });
  const list = Object.values(cats).sort((a, b) => b.total - a.total);
  const top = list[0];
  // wykres kołowy
  const C = 2 * Math.PI * 50; let off = 0;
  const arcs = list.map(c => { const len = total ? c.total / total * C : 0; const a = `<circle cx="65" cy="65" r="50" stroke="${catColors(c.name)[1]}" stroke-dasharray="${Math.max(0, len - 1.5).toFixed(2)} ${C.toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"/>`; off += len; return a; }).join('');
  const per = (k, l) => `<button class="pill ${stat.period === k ? 'on' : ''}" onclick="stat.period='${k}';render()">${l}</button>`;
  return `<section class="card stack" style="gap:14px" id="stats">
    <div class="between"><h2>Na co najwięcej wydajemy</h2><span class="small muted">dotknij, by rozwinąć</span></div>
    <div class="chips">${per('m', 'Miesiąc')}${per('q', '3 miesiące')}${per('y', '12 miesięcy')}
      <button class="pill ${stat.billsIn ? 'on' : ''}" onclick="stat.billsIn=!stat.billsIn;render()">${stat.billsIn ? '✓ ' : ''}z opłatami stałymi</button></div>
    <div class="between" style="background:var(--soft);border-radius:14px;padding:4px">
      <button class="x" style="background:var(--card);width:38px;height:38px" aria-label="Wcześniej" onclick="stat.month=shiftMonth(stat.month,-1);render()">${svg('left', 16)}</button>
      <b style="font-size:14px">${R.label}</b>
      <button class="x" style="background:var(--card);width:38px;height:38px" aria-label="Później" onclick="stat.month=shiftMonth(stat.month,1);render()" ${stat.month >= curMonth() ? 'disabled' : ''}>${svg('right', 16)}</button>
    </div>
    ${!list.length ? '<p class="muted" style="margin:0">Brak wydatków w tym okresie.</p>' : `
    <div class="row" style="gap:16px;align-items:center">
      <svg width="130" height="130" viewBox="0 0 130 130" role="img" aria-label="Udział kategorii w wydatkach" style="flex:0 0 auto">
        <circle cx="65" cy="65" r="50" fill="none" style="stroke:var(--soft)" stroke-width="18"/>
        <g transform="rotate(-90 65 65)" fill="none" stroke-width="18">${arcs}</g>
        <text x="65" y="60" text-anchor="middle" font-size="11" style="font-family:inherit;fill:var(--muted)">razem</text>
        <text x="65" y="79" text-anchor="middle" font-size="16" font-weight="600" style="font-family:inherit;fill:var(--ink)">${esc(zl0(total))}</text>
      </svg>
      <div class="stack" style="gap:6px;flex:1;min-width:0">
        <span class="small muted">Najwięcej idzie na</span>
        <b style="font-size:18px">${esc(top.name)}</b>
        <span class="num" style="font-size:15px">${zl(top.total)} · ${Math.round(top.total / total * 100)}%</span>
        ${R.months.length > 1 ? `<span class="small muted">średnio ${zl0(total / R.months.length)} / mies.</span>` : ''}
      </div>
    </div>
    <div>${list.map(c => {

    }).join('')}</div>`}
  </section>`;
}

    <button class="btn" onclick="closeSheet();expenseSheet()">${svg('plus', 20)}Dodaj ręcznie</button></div>`);

let lastScanB64 = '';
/* Blokada wygaszania ekranu na czas odczytu (Screen Wake Lock – Safari iOS 16.4+) */
let wakeLock = null, wantAwake = false;
async function keepAwake(on) {
  wantAwake = on;
  try {
    if (on && !wakeLock && navigator.wakeLock) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch (e) { wakeLock = null; }
}
// iOS zwalnia blokadę po przełączeniu aplikacji – odnawiamy ją po powrocie, jeśli odczyt nadal trwa
document.addEventListener('visibilitychange', () => { if (wantAwake && document.visibilityState === 'visible') keepAwake(true); });
['cam', 'gal'].forEach(id => document.getElementById(id).addEventListener('change', async ev => {
  const f = ev.target.files && ev.target.files[0]; ev.target.value = '';
  if (!f) return;
  try { lastScanB64 = await shrink(f); } catch (e) { return toast(errMsg(e)); }
  runScan();
}));
function scanWaitSheet(title) {
  openSheet(`<div class="stack" style="text-align:center;padding:30px 0"><div class="spin"></div><h2>${title}</h2><p class="muted" id="scanTimer">0 s</p><p class="small muted">Ekran nie zgaśnie podczas odczytu. Nie zamykaj aplikacji.</p></div>`);
  keepAwake(true);
  const t0 = Date.now();
  clearInterval(scanWaitSheet._i);
  scanWaitSheet._i = setInterval(() => { const el = document.getElementById('scanTimer'); if (el) { const sec = Math.round((Date.now() - t0) / 1000); el.textContent = sec + ' s' + (sec > 90 ? ' – długi paragon, jeszcze chwila…' : ''); } else clearInterval(scanWaitSheet._i); }, 1000);
}
function scanFailSheet(e) {
  clearInterval(scanWaitSheet._i); keepAwake(false);
  const m = errMsg(e);
  const net = /load failed|failed to fetch|network|połączeni/i.test(m);
  openSheet(sheetHead('Nie udało się odczytać') + `<div class="stack">
    <div class="alert">${net ? 'Przerwane połączenie – odczyt trwał zbyt długo albo telefon stracił internet.' : esc(m)}</div>
    <button class="btn pri" style="height:56px" onclick="runScan()">Spróbuj ponownie (to samo zdjęcie)</button>
    <button class="btn" onclick="closeSheet();startScan()">Zrób nowe zdjęcie</button>
    <button class="btn" onclick="closeSheet();expenseSheet()">Dodaj ręcznie</button></div>`);
}
async function runScan() {
  if (!lastScanB64) return startScan();
  scanWaitSheet('Odczytuję paragon…');
  try {
    const r = await api('scanReceipt', lastScanB64, 'image/jpeg');
    clearInterval(scanWaitSheet._i); keepAwake(false);
    setScanState(r);
    reviewSheet();
  } catch (e) { scanFailSheet(e); }
}
function setScanState(r) {
  scanState = { store: r.store || '', date: r.date || today(), total: r.total || 0, receipt: r.receiptUrl || '', fileId: r.fileId || '', engine: r.engine, model: r.model || '', timing: r.timing || null, raw: r.raw || '', aiError: r.aiError || '', voucher: r.voucher || 0, who: (scanState && scanState.who) || D.me,
    items: (r.items || []).map(it => ({ name: it.name, price: it.price, category: it.category, orig: it.category })) };
  if (!scanState.items.length) scanState.items.push({ name: '', price: 0, category: (D.categories[0] || {}).name, orig: '' });
}
async function rescan() {
  const s = scanState;
  const prev = { count: s.items.length, sum: r2(sum(s.items, 'price')), total: s.total };
  scanWaitSheet('Sprawdzam paragon jeszcze raz…');
  try {
    const r = await api('rescanReceipt', s.fileId, prev);
    clearInterval(scanWaitSheet._i); keepAwake(false);
    const newDiff = Math.abs(r2(sum(r.items || [], 'price') - (r.total || s.total)));
    const oldDiff = Math.abs(prev.sum - s.total);
    if (newDiff < oldDiff) { setScanState(r); toast('Poprawiono odczyt'); } else toast('Drugi odczyt nie był lepszy – zostawiam pierwszy');
  } catch (e) { clearInterval(scanWaitSheet._i); keepAwake(false); toast('Nie udało się: ' + errMsg(e)); }
  reviewSheet();
}
function shrink(file) {
  // Zwraca tablicę fragmentów (base64 JPEG). Długi paragon tniemy w poziome pasy z zakładką,
  // żeby każdy fragment miał ≤ 1568 px (tyle AI czyta bez dodatkowego zmniejszania) i drobny druk był ostry.
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      const LONG = 1568, W = Math.min(img.width, 1200);
      const toB64 = (c) => c.toDataURL('image/jpeg', 0.85).split(',')[1];
      if (img.width >= img.height || img.height * (W / img.width) <= 1800) { // krótki paragon – jedno zdjęcie
        const k = Math.min(1, LONG / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        return res([toB64(c)]);
      }
      const k = W / img.width, H = Math.round(img.height * k), STRIP = 1500, OVER = 110;
      const n = Math.ceil((H - OVER) / (STRIP - OVER));
      const parts = [];
      for (let i = 0; i < n; i++) {
        const y = i * (STRIP - OVER);
        const h = Math.min(STRIP, H - y);
        const c = document.createElement('canvas'); c.width = W; c.height = h;
        c.getContext('2d').drawImage(img, 0, y / k, img.width, h / k, 0, 0, W, h);
        parts.push(toB64(c));
      }
      res(parts);
    };
    img.onerror = () => rej(new Error('Nie można wczytać zdjęcia'));
    img.src = url;
  });
}
function reviewSheet() {
  const s = scanState, total = r2(sum(s.items, 'price'));
  const mismatch = s.total && Math.abs(total - s.total) > 0.05;
  const byCat = {}; s.items.forEach(it => byCat[it.category] = (byCat[it.category] || 0) + num(it.price));
  openSheet(sheetHead(`Rozpoznano ${s.items.length} ${s.items.length === 1 ? 'produkt' : s.items.length < 5 ? 'produkty' : 'produktów'}`) + `<div class="stack">
    <div class="grid2"><div class="field"><label for="rStore">Sklep</label><input id="rStore" class="in" value="${esc(s.store)}" oninput="scanState.store=this.value"></div>
      <div class="field"><label for="rDate">Data</label><input id="rDate" type="date" class="in" value="${esc(s.date)}" oninput="scanState.date=this.value"></div></div>
    <div class="card" style="background:var(--soft)"><div class="between"><span class="muted small">Suma pozycji</span><b class="num" style="font-size:24px">${zl(total)}</b></div>
      <div style="display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px;margin-top:10px">${Object.keys(byCat).map(c => `<div style="flex:${Math.max(0, byCat[c])};background:${catColors(c)[1]}"></div>`).join('')}</div>
      <div class="small muted" style="margin-top:8px">${Object.keys(byCat).map(c => esc(c) + ' ' + zl(byCat[c])).join(' · ')}</div></div>
    ${s.voucher ? `<div class="small muted">Rabat ogólny (voucher) −${zl(s.voucher)} rozłożono proporcjonalnie na produkty.</div>` : ''}
    ${mismatch ? `<div class="alert">Suma z paragonu to <b>${zl(s.total)}</b>, a pozycje dają ${zl(total)}. Sprawdź ceny albo dopisz brakującą pozycję.
      ${s.engine === 'ai' && s.fileId ? `<button class="btn sm" style="margin-top:8px;width:100%" onclick="rescan()">Sprawdź ponownie (AI, ok. 20–40 s)</button>` : ''}</div>` : ''}
    <div>${s.items.map((it, i) => `<div class="recrow">
      <input class="in" aria-label="Produkt ${i + 1}" value="${esc(it.name)}" oninput="scanState.items[${i}].name=this.value">
      <input class="in num" aria-label="Cena ${i + 1}" inputmode="decimal" style="text-align:right" value="${String(it.price).replace('.', ',')}" onchange="scanState.items[${i}].price=num(this.value);reviewSheet()">
      <button class="x" style="width:30px;height:30px;background:none" aria-label="Usuń pozycję" onclick="scanState.items.splice(${i},1);reviewSheet()">${svg('close', 16)}</button>
      <select class="in" aria-label="Kategoria ${i + 1}" style="background:${catColors(it.category)[0]};color:${catColors(it.category)[1]};font-weight:600" onchange="pickCatSelect(this, v => { scanState.items[${i}].category = v; reviewSheet(); })">${catOptions(it.category)}</select>
    </div>`).join('')}</div>
    <button class="btn sm" onclick="scanState.items.push({name:'',price:0,category:'${esc((D.categories[0] || {}).name || 'Inne')}',orig:''});reviewSheet()">+ Dodaj pozycję</button>
    <div class="field"><label>Kto zapłacił</label>${segHtml('rWho', whoOptions(), s.who)}</div>
    <p class="small muted" style="margin:0">Zmienione kategorie aplikacja zapamięta i następnym razem przypisze je sama. Odczyt: ${s.engine === 'ai' ? 'AI (' + esc(s.model || 'AI') + ')' : 'OCR Dysku Google'}${s.timing ? ' · ' + s.timing.totalS + ' s' : ''}.</p>
    ${s.aiError ? `<div class="alert">AI nie zadziałało, więc użyto zapasowego odczytu. Błąd: <b>${esc(s.aiError)}</b></div>` : ''}
    ${s.engine === 'ocr' && !s.aiError && !D.ai ? `<div class="alert" style="background:var(--acc-soft);border-color:var(--acc-line);color:var(--link)">Dokładniejszy odczyt daje AI: dodaj klucz <b>ANTHROPIC_API_KEY</b> (Claude) we właściwościach skryptu.</div>` : ''}
    ${s.raw ? `<details><summary class="small muted" style="cursor:pointer">Pokaż tekst odczytany z paragonu</summary><pre style="white-space:pre-wrap;font-size:11px;background:var(--soft);border-radius:10px;padding:10px;max-height:240px;overflow:auto">${esc(s.raw)}</pre></details>` : ''}
    <button class="btn pri" style="height:56px" onclick="saveScan()">Zapisz ${s.items.length} pozycji · ${zl(total)}</button></div>`);
}
function saveScan() {
  const s = scanState; s.who = segVal('rWho');
  const items = s.items.filter(it => it.name.trim() && num(it.price) !== 0).map(it => ({ name: it.name.trim(), price: num(it.price), category: it.category, learn: !!it.orig && it.category !== it.orig }));
  if (!items.length) return toast('Brak pozycji do zapisania');
  closeSheet();
  act('addExpenses', items, { date: s.date, store: s.store.trim(), who: s.who, receipt: s.receipt }).then(ok => ok && toast('Zapisano paragon: ' + zl(sum(items, 'price'))));
}

/* ================= Start ================= */
function boot() {
  api('getData').then(d => { D = d; if (d.theme && d.theme !== theme) applyTheme(d.theme); render(); })
    .catch(e => { if (IS_API) setupScreen('Nie udało się połączyć: ' + errMsg(e)); else document.getElementById('app').innerHTML = `<div class="card"><h2>Nie udało się wczytać danych</h2><p class="muted">${esc(errMsg(e))}</p></div>`; });
}
if (IS_API && !CFG.user) setupScreen();
else if (IS_DEMO && !window.__demoStart) setupScreen();
else boot();
